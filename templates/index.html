<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Control de Asistencia</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f2f2f2;
}

.banner{
    width:100%;
    height:300px;
    background-image:url("/static/banner.png");
    background-size:cover;
    background-position:center;
}

.tarjeta{
    max-width:700px;
    margin:auto;
    margin-top:-60px;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 5px 20px rgba(0,0,0,0.25);
}

h1{
    text-align:center;
    color:#a30000;
    margin-bottom:5px;
}

.subtitulo{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:15px;
}

select{
    width:100%;
    padding:12px;
    font-size:16px;
    margin-top:5px;
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#a30000;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#c00000;
}

.reloj{
    text-align:center;
    font-size:18px;
    color:#444;
    margin-bottom:15px;
}

</style>

</head>

<body>

<div class="banner"></div>

<div class="tarjeta">
<img src="/static/logo_uni.png"
     width="150"
     style="
     display:block;
     margin:auto;
     margin-bottom:15px;
     ">

<h1>Sistema de Asistencia</h1>

<p class="subtitulo">
Voluntarios del Sesquicentenario UNI
</p>

<div class="reloj" id="reloj"></div>

<form action="/registrar" method="POST" enctype="multipart/form-data">

<label>Comité</label>

<select id="comite" name="comite" onchange="actualizarNombres()">

{% for c in comites %}
<option value="{{ c }}">{{ c }}</option>
{% endfor %}

</select>

<label>Nombre</label>

<select id="nombre" name="nombre"></select>

<button type="submit">
    <label>Evidencia de reunión</label>

<input
    type="file"
    name="evidencia"
    accept="image/*"
    required
    style="
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    ">
✅ Registrar Asistencia
</button>

</form>
<br>

<a href="/consultar">

<button
type="button"
style="
width:100%;
padding:15px;
background:#444;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
">

📋 Consultar Asistencias

</button>

</a>
</div>

<script>

const datos = {{ miembros_por_comite | tojson }};

function actualizarNombres(){

    let comite = document.getElementById("comite").value;

    let nombres = datos[comite];

    let selectNombre = document.getElementById("nombre");

    selectNombre.innerHTML = "";

    nombres.forEach(function(nombre){

        let opcion = document.createElement("option");

        opcion.value = nombre;

        opcion.text = nombre;

        selectNombre.appendChild(opcion);

    });
}

actualizarNombres();

function actualizarReloj(){

    let ahora = new Date();

    document.getElementById("reloj").innerHTML =
        ahora.toLocaleDateString() +
        " - " +
        ahora.toLocaleTimeString();

}

setInterval(actualizarReloj,1000);

actualizarReloj();

</script>

</body>
</html>
